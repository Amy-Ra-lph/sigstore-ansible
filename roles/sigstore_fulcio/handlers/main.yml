---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart fulcio
  ansible.builtin.systemd:
    name: fulcio.service
    state: restarted

- name: Restart akamu-signing-adapter
  ansible.builtin.systemd:
    name: akamu-signing-adapter.service
    state: restarted
