---
- name: Template Trillian log_server quadlet
  ansible.builtin.template:
    src: rekor-trillian-logserver.container.j2
    dest: /etc/containers/systemd/rekor-trillian-logserver.container
    mode: "0644"
  notify:
    - Daemon reload
    - Restart rekor-trillian-logserver

- name: Flush handlers to deploy logserver
  ansible.builtin.meta: flush_handlers

- name: Start Trillian log_server service
  ansible.builtin.systemd:
    name: rekor-trillian-logserver
    state: started
    daemon_reload: true

- name: Wait for log_server gRPC port
  ansible.builtin.wait_for:
    port: "{{ sigstore_rekor_trillian_grpc_port }}"
    host: 127.0.0.1
    timeout: 30
