---
- name: Check if cosign is installed
  ansible.builtin.stat:
    path: /usr/local/bin/cosign
  register: _cosign_bin

- name: Set cosign architecture
  ansible.builtin.set_fact:
    _cosign_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
  when: not _cosign_bin.stat.exists

- name: Download cosign binary
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ sigstore_rekor_cosign_version }}/cosign-linux-{{ _cosign_arch }}"
    dest: /usr/local/bin/cosign
    mode: "0755"
  when: not _cosign_bin.stat.exists
