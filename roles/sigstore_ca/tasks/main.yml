---
- name: Create sigstore CA directory
  ansible.builtin.file:
    path: "{{ sigstore_ca_dir }}"
    state: directory
    mode: "0755"
  tags: sigstore_ca

- name: Deploy CA using IPAthinCA
  ansible.builtin.include_tasks: ipathinca.yml
  when: sigstore_ca_mode == 'ipathinca'
  tags: sigstore_ca

- name: Deploy CA using Dogtag CSR flow
  ansible.builtin.include_tasks: dogtag_csr.yml
  when: sigstore_ca_mode == 'dogtag_csr'
  tags: sigstore_ca

- name: Deploy CA using Dogtag PKCS#11
  ansible.builtin.include_tasks: dogtag_pkcs11.yml
  when: sigstore_ca_mode == 'dogtag_pkcs11'
  tags: sigstore_ca

- name: Copy IPA root CA chain
  ansible.builtin.copy:
    src: /etc/ipa/ca.crt
    dest: "{{ sigstore_ca_dir }}/root-ca.pem"
    mode: "0644"
    remote_src: true
  tags: sigstore_ca

- name: Verify sub-CA certificate chain
  ansible.builtin.command:
    cmd: openssl verify -CAfile {{ sigstore_ca_dir }}/root-ca.pem {{ sigstore_ca_dir }}/ca-cert.pem
  changed_when: false
  when: sigstore_ca_mode != 'dogtag_pkcs11'
  tags: sigstore_ca
