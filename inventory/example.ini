# Example inventory for sigstore deployment
# Replace hostnames and IPs with your actual lab hosts.

[sigstore_ca_servers]
idm.example.com ansible_host=192.168.1.10

[sigstore_rekor_hosts]
idm.example.com ansible_host=192.168.1.10 sigstore_rekor_is_signer=true sigstore_rekor_build_images=true sigstore_rekor_is_db=true

[sigstore_db]
idm.example.com ansible_host=192.168.1.10

[sigstore_clients]
idm.example.com ansible_host=192.168.1.10
client.example.com ansible_host=192.168.1.11

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args=-o StrictHostKeyChecking=no
ipa_realm=EXAMPLE.COM
